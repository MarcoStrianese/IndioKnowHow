# Il piano gratuito di Supabase sospende i progetti inattivi da circa una settimana.
# Questo job fa una piccola interrogazione al database due volte a settimana.
# Richiede due "secrets" nel repository: SUPABASE_URL e SUPABASE_KEY (vedi README).
name: Tieni attivo Supabase

on:
  schedule:
    - cron: '17 6 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then echo "Secrets non configurati: salto."; exit 0; fi
          curl -sS -f -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" -d '{}'
